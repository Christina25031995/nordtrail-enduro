# Автовыгрузка сайта на хостинг TinaDigital (reg.ru Хост-1, server287) при каждом пуше в main.
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   FTP_USERNAME — FTP-пользователь с домашней папкой www
#   FTP_PASSWORD — его пароль
name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Skip if FTP secrets are not set yet
        if: env.HAS_FTP != 'true'
        run: echo "FTP_PASSWORD is not set — nothing to deploy yet."

      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'
        with:
          # полная история (без старых blob'ов): cdnify закрепляет каждый файл
          # за коммитом, где он менялся последний раз, чтобы кэш CDN не сбрасывался
          fetch-depth: 0
          filter: blob:none

      # Тяжёлые фото и видео в HTML переписываются на jsDelivr (файлы до 20 МБ),
      # при ошибке CDN страница берёт файл с enduro-energy.ru. В репозитории пути остаются относительными.
      - name: Point media at jsDelivr CDN
        if: env.HAS_FTP == 'true'
        run: python3 .github/scripts/cdnify.py . "${{ github.sha }}" "${{ github.repository }}"

      - name: Upload via FTPS
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server287.hosting.reg.ru
          protocol: ftps
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./enduro-energy.ru/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/node_modules/**
            CNAME
            .nojekyll
            README*
            **/_tools/**
            **/_preview/**
            package.json
            package-lock.json
